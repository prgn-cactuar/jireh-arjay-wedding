<script>
/* ===================== Edit everything here ===================== */
const INVITE = {

  welcomeTitle: "Welcome to our wedding",
  welcome: "We are so happy to share this day with you. It would not be complete without the people we love most, gathered in one garden.",
  venue: "Annabelle Events Place",
  address: ["Porac, Pampanga"],
  ceremony: "4:00 PM",
  reception: "5:00 PM",
  mapQuery: "Annabelle Events Place, Porac, Pampanga",
  venuePage: "https://www.facebook.com/p/Annabelle-Events-Place-100094379537231/",
  dressCode: "Formal Attire",
  dressNote: "Join us in celebrating in your finest formal attire—floor-length gowns and vibrant or colorful barongs/long sleeves are highly encouraged!",
  palette: [["Blush", "#e6c2c3"], ["Wisteria", "#a88bb3"], ["Sage", "#9aa585"], ["Champagne", "#e8d6bd"], ["Dusty Blue", "#9fb4c8"], ["Warm Ochre", "#c99a4e"]],
  story: "We first met at a youth camp in 2013. Four years later, in 2017, we found our way back to each other and started talking again. What began as easy conversations slowly grew into something deeper, and in December 2025 we said yes to forever. Now we can't wait to begin this next chapter with you.",

    ["arrive",  "3:30 PM", "Guests arrive", ""],

    ["grazing", "5:00 PM", "Grazing table opens", ""],
    ["cake",    "5:30 PM", "Couple's entrance", "Wedding prayer, wine toasting and cake cutting"],
    ["dinner",  "6:00 PM", "Dinner and program", "Picture taking, parents' message, money dance, bouquet toss and the couple's thank you"],
    ["disco",   "7:30 PM", "Party", "Dancing onwards"],
    ["sparkle", "9:00 PM", "Send-off", ""]
  ],
  gifts: "Your presence is the greatest gift we could ask for. If you wish to bless us further, a monetary gift toward our new life together would be deeply appreciated. But if your heart is set on giving a gift, we will receive it with grateful hearts.",
  rsvpBy: "31 May 2027",
  rsvpUrl: "",                                // paste the RSVP form link here

  rsvpContact: "+63 935 535 8685"
};
/* ================================================================ */

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const f = n => Math.round(n * 10) / 10;
let seed = 11;
const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const pick = a => a[Math.floor(rnd() * a.length)];
const q = (p0, p1, p2, t) => [(1-t)*(1-t)*p0[0] + 2*(1-t)*t*p1[0] + t*t*p2[0], (1-t)*(1-t)*p0[1] + 2*(1-t)*t*p1[1] + t*t*p2[1]];

/* ---------- embroidered primitives ---------- */
const sat = (shape, fill, pat = "satA") => shape.replace("/>", ` fill="${fill}"/>`) + shape.replace("/>", ` fill="url(#${pat})"/>`);
const pearl = (x, y, r) => `<circle cx="${f(x)}" cy="${f(y)}" r="${f(r)}" fill="url(#pearl)"/>`;
const strand = (p0, p1, p2, n, r) => Array.from({ length: n }, (_, i) => { const [x, y] = q(p0, p1, p2, i / (n - 1)); return pearl(x, y, r); }).join("");
const leaf = (x, y, len, ang, col = "#7d8c63") => {
  const d = `M0 0 Q${f(len*.5)} ${f(-len*.34)} ${f(len)} 0 Q${f(len*.5)} ${f(len*.34)} 0 0Z`;
  return `<g transform="translate(${f(x)} ${f(y)}) rotate(${f(ang)})">${sat(`<path d="${d}"/>`, col, ang > 0 ? "satA" : "satB")}<path d="M1 0H${f(len*.85)}" stroke="#5c6a46" stroke-width=".5"/></g>`;
};
const TONES = { cream: ["#f6ece4", "#d6bfb2"], blush: ["#e9bfc2", "#c48c94"], dusty: ["#d59ea8", "#a8697a"], wine: ["#a95b6c", "#77384a"] };
const rose = (x, y, r, tone = "blush") => {
  const [c0, c1] = TONES[tone];
  let arcs = "";
  [.84, .62, .42, .22].forEach((k, i) => {
    const a0 = (i * 97 + 20) * Math.PI / 180, a1 = a0 + 4.4, rr = r * k;
    arcs += `<path d="M${f(Math.cos(a0)*rr)} ${f(Math.sin(a0)*rr)} A${f(rr)} ${f(rr)} 0 1 1 ${f(Math.cos(a1)*rr)} ${f(Math.sin(a1)*rr)}" fill="none" stroke="${c1}" stroke-width="${f(Math.max(.6, r*.11))}" stroke-linecap="round"/>`;
  });
  return `<g transform="translate(${f(x)} ${f(y)})">${sat(`<circle r="${f(r)}"/>`, c0)}${arcs}<circle r="${f(r*.12)}" fill="${c1}"/></g>`;
};
const WIST = ["#7a5d8a", "#9677a6", "#b297bd", "#cbb4d1"];
const wisteria = (x, y, len, w) => {
  let out = "";
  const n = Math.max(4, Math.round(len / 3.6));
  for (let k = 0; k < n; k++) {
    const t = k / (n - 1), wy = y + k * (len / n), ww = w * (1 - t * .8);
    const count = t < .6 ? 3 : 2;
    for (let j = 0; j < count; j++) {
      const fx = x + (rnd() - .5) * ww, r = 3.1 * (1 - t * .55);
      const col = WIST[Math.min(3, Math.floor(t * 2.2 + rnd() * 1.8))];
      out += `<circle cx="${f(fx)}" cy="${f(wy)}" r="${f(r)}" fill="${col}"/>`;
    }
  }
  return `<g filter="url(#emb)">${out}</g>`;
};

/* ---------- compositions ---------- */
function garland(h, opt = {}) {
  const y0 = opt.y0 ?? 18, sag = opt.sag ?? 30, minL = opt.minL ?? 30, maxL = opt.maxL ?? h - 40;
  const P = [[-10, y0], [195, y0 + sag], [400, y0]];
  const yAt = x => q(...P, (x + 10) / 410)[1];
  let clusters = "", pearls = "", leaves = "", roses = "";
  for (let x = 12; x < 390; x += 26 + rnd() * 8) {
    const edge = Math.abs(x - 195) / 195;
    const L = minL + (maxL - minL) * (.35 + .65 * edge) * (.7 + rnd() * .3);
    clusters += wisteria(x, yAt(x) + 6, L, 16);
  }
  for (let x = 20; x < 380; x += 52) {
    const a = [x, yAt(x) + 3], b = [x + 26, yAt(x + 26) + 3];
    pearls += strand(a, [x + 13, Math.max(a[1], b[1]) + 22], b, 9, 1.7);
  }
  for (let x = 0; x < 392; x += 11) {
    const y = yAt(x);
    leaves += leaf(x, y, 11 + rnd() * 5, (x / 11 % 2 ? -1 : 1) * (35 + rnd() * 35) + (x % 2 ? 180 : 0));
  }
  [40, 118, 195, 272, 350].forEach((x, i) => { roses += rose(x, yAt(x), 8 + rnd() * 2, ["dusty", "cream", "wine", "cream", "dusty"][i]); });
  return `<svg viewBox="0 0 390 ${h}" aria-hidden="true">${clusters}<path d="M${P[0]} Q${P[1]} ${P[2]}" fill="none" stroke="#7b6a58" stroke-width="2.6"/><g filter="url(#emb)">${leaves}</g>${pearls}<g filter="url(#emb)">${roses}</g></svg>`;
}

const bloom5 = (x, y, r, c, core = "#e8c46a") => `<g transform="translate(${f(x)} ${f(y)}) rotate(${f(rnd() * 72)})">${[0, 72, 144, 216, 288].map(a => { const px = Math.cos(a * Math.PI / 180) * r * .62, py = Math.sin(a * Math.PI / 180) * r * .62; return `<ellipse cx="${f(px)}" cy="${f(py)}" rx="${f(r * .52)}" ry="${f(r * .4)}" transform="rotate(${a} ${f(px)} ${f(py)})" fill="${c}"/>`; }).join("")}<circle r="${f(r * .26)}" fill="${core}"/></g>`;

function tieback(side) {
  seed = side === "l" ? 301 : 302;
  let s = "";
  for (let k = 0; k < 9; k++) s += leaf(23, 20, 10 + rnd() * 4, k * 40 + rnd() * 20, k % 2 ? "#7d8c63" : "#8a9870");
  s += wisteria(15, 30, 22, 9) + wisteria(31, 30, 18, 8);
  s += bloom5(12, 14, 5, "#9fb4c8") + bloom5(35, 15, 5, "#f1e3c4") + bloom5(14, 27, 4.5, "#e6c2c3") + bloom5(33, 27, 4.5, "#c8b2d6");
  s += rose(23, 20, 8, "dusty");
  return `<svg class="tieback ${side}" viewBox="0 0 46 58" aria-hidden="true"><g filter="url(#emb)">${s}</g></svg>`;
}


function curtainFlowers(side) {
  seed = side === "l" ? 501 : 777;
  const W = 160, H = 430;
  const daisy = (x, y, r) => `<g transform="translate(${f(x)} ${f(y)}) rotate(${f(rnd() * 45)})">${Array.from({ length: 8 }, (_, k) => `<ellipse cx="0" cy="${f(-r * .6)}" rx="${f(r * .22)}" ry="${f(r * .5)}" transform="rotate(${k * 45})" fill="#fffdfb" stroke="#dcc6c6" stroke-width=".3"/>`).join("")}<circle r="${f(r * .24)}" fill="#e8c46a"/></g>`;
  const sprig = (x, y, len, ang, c) => {
    let o = `<g transform="translate(${f(x)} ${f(y)}) rotate(${f(ang)})"><path d="M0 0 Q${f(len * .3)} ${f(-len * .5)} 0 ${f(-len)}" fill="none" stroke="#8a9870" stroke-width=".7"/>`;
    for (let k = 1; k <= 4; k++) { const t = k / 5; o += `<ellipse cx="${f(len * .3 * 2 * t * (1 - t) + (k % 2 ? 1.6 : -1.6))}" cy="${f(-len * t)}" rx="1.3" ry="1.9" fill="${c}"/>`; }
    return o + `</g>`;
  };
  const knots = (x, y, c) => Array.from({ length: 3 }, () => `<circle cx="${f(x + (rnd() - .5) * 8)}" cy="${f(y + (rnd() - .5) * 8)}" r="${f(.8 + rnd() * .6)}" fill="${c}"/>`).join("");
  const soft = ["#e6c2c3", "#c8b2d6", "#a9bfd6", "#f1e3c4", "#b9c4a5", "#e3c48f", "#ffffff", "#ffffff"];
  let s = "";
  for (let gy = 0; gy < H; gy += 30) {
    for (let gx = 0; gx < W; gx += 28) {
      if (rnd() < .14) continue;
      const x = gx + 4 + rnd() * 20, y = gy + 4 + rnd() * 22, kind = rnd(), c = pick(soft);
      let g = "";
      if (rnd() < .6) g += leaf(x, y, 6 + rnd() * 4, rnd() * 360, rnd() < .5 ? "#9aa585" : "#b9c4a5");
      if (kind < .26) g += bloom5(x, y, 3 + rnd() * 3, c, rnd() < .5 ? "#e8c46a" : "#c48c94");
      else if (kind < .42) g += rose(x, y, 3 + rnd() * 2.6, pick(["cream", "blush", "dusty", "cream"]));
      else if (kind < .6) g += daisy(x, y, 4 + rnd() * 3);
      else if (kind < .74) g += sprig(x, y, 12 + rnd() * 8, (rnd() - .5) * 70, pick(["#b297bd", "#c8b2d6", "#a9bfd6", "#e6c2c3"]));
      else if (kind < .86) g += knots(x, y, pick(soft));
      else g += bloom5(x, y, 2 + rnd() * 1.5, "#ffffff", "#f1e3c4") + bloom5(x + 5, y + 4, 1.8 + rnd(), pick(soft));
      s += `<g opacity="${f(.75 + rnd() * .25)}">${g}</g>`;
    }
  }
  return `<svg class="cf" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMin slice" aria-hidden="true"><g filter="url(#emb)">${s}</g></svg>`;
}

function valance() {
  seed = 120;
  const pale = ["#e6c2c3", "#c8b2d6", "#a9bfd6", "#f1e3c4", "#ffffff"];
  let s = "";
  for (let i = 0; i < 3; i++) {
    const x0 = i * 130;
    s += `<g filter="url(#emb)">${sat(`<path d="M${x0} 10 Q${x0+65} 78 ${x0+130} 10 Q${x0+65} 44 ${x0} 10Z"/>`, "#f9f0ef", "satB")}
      <path d="M${x0+14} 16 Q${x0+65} 58 ${x0+116} 16" fill="none" stroke="#e3cccd" stroke-width="1"/>
      <path d="M${x0+28} 14 Q${x0+65} 44 ${x0+102} 14" fill="none" stroke="#e3cccd" stroke-width="1"/></g>`;
    let g = `<path d="M${x0 + 4} 12 Q${x0 + 65} 80 ${x0 + 126} 12" fill="none" stroke="#7b6a58" stroke-width="1"/>`;
    for (let k = 0; k <= 16; k++) {
      const [x, y] = q([x0 + 4, 12], [x0 + 65, 80], [x0 + 126, 12], k / 16);
      g += leaf(x, y, 7 + rnd() * 2, rnd() * 360);
      g += k % 4 === 2 ? rose(x, y, 4.2, pick(["blush", "cream", "dusty"])) : k % 2 ? bloom5(x, y, 3.4, pick(pale)) : "";
    }
    s += `<g filter="url(#emb)">${g}</g>`;
  }
  for (let i = 0; i <= 3; i++) {
    const x = i * 130;
    s += `<g filter="url(#emb)">${sat(`<path d="M${x-9} 8 L${x+9} 8 L${x+6} 56 Q${x} 62 ${x-6} 56Z"/>`, "#f4e6e5", "satV")}</g>`;
    s += wisteria(x, 60, 22, 9) + `<g filter="url(#emb)">${rose(x, 58, 4.5, "dusty")}</g>`;
  }
  s += `<rect x="0" y="0" width="390" height="11" fill="#f6ebea"/><rect x="0" y="0" width="390" height="11" fill="url(#satV)"/>`;
  let top = "";
  for (let x = 2; x < 392; x += 9) {
    top += leaf(x, 11, 7, x % 18 < 9 ? 30 : 150);
    top += (x / 9 | 0) % 3 === 1 ? rose(x, 11, 3.8, pick(["blush", "cream", "dusty", "wine"])) : bloom5(x, 11, 3.4, pick(pale));
  }
  s += `<g filter="url(#emb)">${top}</g>`;
  return `<svg class="valance" viewBox="0 0 390 96" aria-hidden="true">${s}</svg>`;
}

function estate() {
  seed = 4;
  const WOOD = "#b97a4e", WOOD_D = "#8e5a37";
  let s = "";
  // string lights
  const bulbs = (p0, p1, p2, n) => {
    let o = `<path d="M${p0} Q${p1} ${p2}" fill="none" stroke="#6b5a4c" stroke-width=".6"/>`;
    for (let i = 1; i < n; i++) { const [x, y] = q(p0, p1, p2, i / n); o += `<circle cx="${f(x)}" cy="${f(y + 2)}" r="3" fill="#fbe7b0" opacity=".35"/><circle cx="${f(x)}" cy="${f(y + 2)}" r="1.4" fill="#f6dc94"/>`; }
    return o;
  };
  s += bulbs([0, 112], [60, 150], [124, 130], 9) + bulbs([266, 130], [330, 150], [390, 112], 9) + bulbs([0, 132], [70, 168], [118, 150], 8) + bulbs([272, 150], [320, 168], [390, 132], 8);
  // trees
  const tree = (x, y, h, w) => `<path d="M${x} ${y + h} V${y + h * .35}" stroke="#7b6450" stroke-width="2.4"/>` +
    sat(`<ellipse cx="${x}" cy="${y + h * .28}" rx="${w}" ry="${h * .3}"/>`, "#7f9460", "satB") +
    sat(`<ellipse cx="${x - w * .5}" cy="${y + h * .42}" rx="${w * .6}" ry="${h * .16}"/>`, "#8ea36c") +
    sat(`<ellipse cx="${x + w * .5}" cy="${y + h * .38}" rx="${w * .6}" ry="${h * .16}"/>`, "#74885a");
  s += `<g filter="url(#emb)">${tree(30, 70, 140, 26)}${tree(84, 104, 108, 18)}${tree(336, 96, 116, 14)}${tree(372, 84, 128, 13)}</g>`;
  // hedge across the back (hides curtain hems)
  s += `<g filter="url(#emb)">${sat(`<path d="M0 196 Q30 186 60 194 Q90 186 120 196 L120 240 L0 240Z"/>`, "#6f845a", "satB")}${sat(`<path d="M390 196 Q360 186 330 194 Q300 186 270 196 L270 240 L390 240Z"/>`, "#6f845a")}</g>`;
  // pavilion: back gable, glass roof, side slat walls, front gable
  s += `<g filter="url(#emb)">
    <polygon points="195,70 108,142 282,142" fill="#e7eef0" opacity=".8"/>
    <polygon points="195,70 108,142 282,142" fill="url(#satB)"/>
    <path d="M195 104 L140 156 H250 Z" fill="none" stroke="${WOOD_D}" stroke-width="2.5"/>
    <path d="M195 70 L195 104 M108 142 L140 156 M282 142 L250 156" stroke="${WOOD}" stroke-width="2"/>
    ${sat(`<polygon points="104,142 142,158 142,230 104,240"/>`, WOOD, "satV")}
    ${sat(`<polygon points="286,142 248,158 248,230 286,240"/>`, WOOD, "satV")}
  </g>`;
  for (let i = 1; i < 6; i++) { const xl = 104 + i * 38 / 6, xr = 286 - i * 38 / 6, t = i / 6; s += `<path d="M${f(xl)} ${f(142 + 16 * t)}V${f(240 - 10 * t)}M${f(xr)} ${f(142 + 16 * t)}V${f(240 - 10 * t)}" stroke="${WOOD_D}" stroke-width=".8"/>`; }
  // backdrop
  s += `<g filter="url(#emb)">
    ${sat(`<rect x="144" y="168" width="102" height="58"/>`, "#efd8d3", "satV")}
    <path d="M144 226 L158 204 L170 214 L184 196 L200 226Z" fill="#dcaab0"/><path d="M150 226 L166 210 L178 226Z" fill="#e8c0b0"/>
    <circle cx="190" cy="198" r="16" fill="#f4e6c9"/><circle cx="190" cy="198" r="16" fill="url(#satA)"/>
    <circle cx="176" cy="200" r="13" fill="none" stroke="#a5b97c" stroke-width="3.2"/>
    <circle cx="205" cy="184" r="9" fill="none" stroke="#efe2bd" stroke-width="2.6"/>
    <path d="M214 226V200a7 7 0 0 1 14 0V226" fill="none" stroke="#f1e7cf" stroke-width="3.4"/>
    <path d="M226 226V206a6 6 0 0 1 12 0V226" fill="none" stroke="#f1e7cf" stroke-width="3"/>
  </g>
  <text x="158" y="184" font-family="Ingrid Darling, Snell Roundhand, cursive" font-size="14" fill="#b08374">${esc(INVITE.monogram)}</text>
  <path d="M195 104V120" stroke="#9a8a7a" stroke-width=".6"/><path d="M188 121 Q195 132 202 121" fill="none" stroke="#e9e1d6" stroke-width="1.4"/>${pearl(190, 125, 1.4)}${pearl(195, 128, 1.6)}${pearl(200, 125, 1.4)}`;
  // front gable frame (on top)
  s += `<g filter="url(#emb)"><path d="M104 142 L195 64 L286 142 M104 142 H286 M150 142 V103 M240 142 V103 M195 64 V142" fill="none" stroke="${WOOD}" stroke-width="5" stroke-linejoin="round"/></g>`;
  // stage + flowers
  s += `<rect x="140" y="226" width="110" height="8" fill="#efe6dd"/>`;
  let fl = "";
  const bloom = (x, y, r, c) => `<g transform="translate(${f(x)} ${f(y)})">${[0, 72, 144, 216, 288].map(a => `<circle cx="${f(Math.cos(a * Math.PI / 180) * r * .6)}" cy="${f(Math.sin(a * Math.PI / 180) * r * .6)}" r="${f(r * .5)}" fill="${c}"/>`).join("")}<circle r="${f(r * .25)}" fill="#e8c46a"/></g>`;
  for (let x = 146; x < 248; x += 7) {
    const y = 222 + rnd() * 6;
    fl += rnd() > .5 ? rose(x, y, 3.6 + rnd() * 1.5, pick(["cream", "blush", "dusty"])) : bloom(x, y, 4, pick(["#a9bfd6", "#f1d98f", "#ffffff", "#c9b2d6"]));
  }
  s += `<g filter="url(#emb)">${fl}</g>`;
  // lawn + stone aisle
  s += `<g filter="url(#emb)">${sat(`<path d="M0 236 Q195 228 390 236 V336 H0Z"/>`, "#8fa66b", "satB")}</g>`;
  let path = `<path d="M184 234 H206 L236 336 H154Z" fill="#f3efe8"/>`;
  for (let i = 0; i < 70; i++) { const t = rnd(), y = 236 + t * 100, half = 11 + t * 34; path += `<circle cx="${f(195 + (rnd() * 2 - 1) * half)}" cy="${f(y)}" r="${f(.6 + t)}" fill="#fff"/>`; }
  for (let row = 0, y = 238; y < 336; row++) {
    const h = 4 + (y - 236) * .07, half = 11 + (y - 236) * .34, w = half * .9;
    path += `<rect x="${f(195 - w + (row % 2) * 3)}" y="${f(y)}" width="${f(w * 2 - 6)}" height="${f(h)}" rx="${f(h * .4)}" fill="#ddd4c4"/>`;
    y += h + 2 + (y - 236) * .03;
  }
  s += `<g filter="url(#emb)">${path}</g>`;
  // tables and chairs
  const table = (x, y, r) => {
    let o = "";
    o += sat(`<ellipse cx="${x}" cy="${y}" rx="${r}" ry="${f(r * .32)}"/>`, "#c79a6e");
    o += `<path d="M${x} ${f(y + r * .3)}V${f(y + r * .55)}" stroke="#8e5a37" stroke-width="${f(r * .1)}"/>`;
    o += `<rect x="${f(x - r * .07)}" y="${f(y - r * .5)}" width="${f(r * .14)}" height="${f(r * .45)}" rx="${f(r * .05)}" fill="#fbf8f4"/>`;
    o += rose(x, y - r * .5, r * .16, pick(["blush", "cream", "dusty"]));
    for (let k = -2; k <= 2; k++) if (k) o += `<circle cx="${f(x + k * r * .32)}" cy="${f(y - r * .06)}" r="${f(r * .06)}" fill="#ffffff" opacity=".9"/>`;
    for (let k = -1; k <= 1; k++) {
      const cx = x + k * r * .62, cy = y + r * .36, cw = r * .26, ch = r * .42;
      o += `<path d="M${f(cx - cw / 2)} ${f(cy + ch)}V${f(cy)}H${f(cx + cw / 2)}V${f(cy + ch)}M${f(cx - cw / 2)} ${f(cy + ch * .3)}H${f(cx + cw / 2)}" fill="none" stroke="#b07d55" stroke-width="${f(Math.max(1, r * .05))}" stroke-linejoin="round"/>`;
    }
    return o;
  };
  const velvet = (x, y, r) => sat(`<rect x="${f(x - r)}" y="${f(y - r * 1.1)}" width="${f(r * 2)}" height="${f(r * 2.1)}" rx="${f(r * .7)}"/>`, "#a9b04f");
  let tb = velvet(160, 244, 4) + velvet(150, 248, 4.4) + velvet(230, 244, 4) + velvet(240, 248, 4.4);
  tb += table(118, 252, 22) + table(272, 252, 22) + table(50, 258, 26) + table(340, 258, 26);
  tb += table(98, 290, 34) + table(292, 290, 34) + table(22, 310, 34) + table(368, 310, 34);
  s += `<g filter="url(#emb)">${tb}</g>`;
  // corner roses
  let bed = "";
  for (let i = 0; i < 16; i++) {
    const side = i % 2, x = side ? 360 + rnd() * 34 : rnd() * 34, y = 318 + rnd() * 20;
    bed += leaf(x + 5, y + 3, 10, 20 + rnd() * 40) + leaf(x - 5, y + 3, 10, 130 + rnd() * 30) + rose(x, y, 7 + rnd() * 4, pick(["cream", "blush", "dusty", "wine"]));
  }
  s += `<g filter="url(#emb)">${bed}</g>`;
  return `<svg class="estate" viewBox="0 0 390 336" aria-hidden="true">${s}</svg>`;
}

function flowerArch() {
  seed = 91;
  const at = a => [100 + 74 * Math.cos(a), 150 - 118 * Math.sin(a)];
  let frame = `<path d="M26 156 V150 A74 118 0 0 1 174 150 V156" fill="none" stroke="#b9a48e" stroke-width="2.2"/>`;
  let back = "", front = "";
  const bloom = (x, y, r, c) => `<g transform="translate(${f(x)} ${f(y)})">${[0, 72, 144, 216, 288].map(a => `<circle cx="${f(Math.cos(a * Math.PI / 180) * r * .6)}" cy="${f(Math.sin(a * Math.PI / 180) * r * .6)}" r="${f(r * .5)}" fill="${c}"/>`).join("")}<circle r="${f(r * .25)}" fill="#e8c46a"/></g>`;
  for (let i = 0; i <= 40; i++) {
    const a = Math.PI * i / 40, [x, y] = at(a);
    back += leaf(x, y, 9 + rnd() * 4, rnd() * 360);
    if (a > .7 && a < 2.45 && i % 3 === 0) back += wisteria(x + (rnd() - .5) * 6, y + 6, 18 + rnd() * 18, 9);
  }
  for (let i = 0; i <= 26; i++) {
    const a = Math.PI * i / 26, [x, y] = at(a), r = rnd();
    front += r < .55 ? rose(x + (rnd() - .5) * 6, y + (rnd() - .5) * 6, 5 + rnd() * 3.5, pick(["cream", "blush", "dusty", "wine"]))
                     : bloom(x + (rnd() - .5) * 6, y + (rnd() - .5) * 6, 4.5, pick(["#a9bfd6", "#f1d98f", "#ffffff", "#c9b2d6"]));
  }
  [[26, 156], [174, 156]].forEach(([x, y]) => {
    for (let k = 0; k < 9; k++) front += k % 2 ? rose(x + (rnd() - .5) * 26, y - rnd() * 16, 5 + rnd() * 3, pick(["cream", "blush", "wine"])) : leaf(x, y - 4, 12, 180 + rnd() * 180);
  });
  let grass = "";
  for (let x = 4; x < 198; x += 4) grass += `<path d="M${x} 166 q${f((rnd() - .5) * 4)} -${f(4 + rnd() * 5)} ${f((rnd() - .5) * 3)} -${f(6 + rnd() * 5)}" stroke="#7d8c63" stroke-width=".9" fill="none"/>`;
  return `<svg viewBox="0 0 200 170" style="width:220px;max-width:75%" aria-hidden="true">${frame}<g filter="url(#emb)">${back}</g><g filter="url(#emb)">${front}</g>${grass}</svg>`;
}

function pearlBand() {
  seed = 21;
  let s = sat(`<rect x="0" y="6" width="390" height="34"/>`, "#b9bfa8", "satV");
  for (let x = 2; x < 392; x += 6.4) s += pearl(x, 12, 2.6) + pearl(x + 3, 34, 2.6);
  let r = "";
  for (let x = 20; x < 390; x += 44) r += leaf(x - 4, 23, 12, 200) + leaf(x + 4, 23, 12, -20) + rose(x, 23, 8.5, x % 88 < 44 ? "wine" : "blush");
  return `<svg class="bleed" viewBox="0 0 390 46" aria-hidden="true"><g filter="url(#emb)">${s}</g><g filter="url(#emb)">${r}</g></svg>`;
}

function necklace() {
  seed = 33;
  let p = "", deco = "";
  for (let k = 2; k >= 0; k--) p += strand([-10, 18 + k * 9], [195, 118 + k * 12], [400, 18 + k * 9], 64 - k * 2, 3.3 - k * .25);
  for (let t = 0; t <= 1.001; t += .035) {
    const [x, y] = q([-10, 8], [195, 100], [400, 8], t);
    deco += leaf(x, y, 13, -90 + (rnd() - .5) * 90) + leaf(x, y, 11, 90 + (rnd() - .5) * 60, "#8a9870");
  }
  for (let t = .06; t < 1; t += .125) { const [x, y] = q([-10, 8], [195, 100], [400, 8], t); deco += rose(x, y, 8.5, t > .4 && t < .6 ? "wine" : "dusty"); }
  return `<svg class="bleed" viewBox="0 0 390 150" aria-hidden="true">${p}<g filter="url(#emb)">${deco}</g></svg>`;
}

function arbor() {
  seed = 44;
  let s = `<path d="M6 30 Q177 -4 348 30" fill="none" stroke="#7b6a58" stroke-width="2.2"/>`;
  let c = "", lv = "";
  for (let x = 14; x < 344; x += 22) {
    const y = 30 - 34 * Math.sin(Math.PI * (x - 6) / 342) * .5;
    const edge = Math.abs(x - 177) / 177;
    c += wisteria(x, y + 6, 18 + 40 * edge + rnd() * 10, 14);
    lv += leaf(x, y, 12, -40 - rnd() * 40) + leaf(x + 8, y, 11, 30 + rnd() * 40, "#8a9870");
  }
  [30, 110, 177, 244, 324].forEach((x, i) => { const y = 30 - 34 * Math.sin(Math.PI * (x - 6) / 342) * .5; lv += rose(x, y, 8, i % 2 ? "cream" : "dusty"); });
  return `<svg viewBox="0 0 354 96" aria-hidden="true">${c}${s}<g filter="url(#emb)">${lv}</g></svg>`;
}

function hangingVines() {
  seed = 55;
  let s = "";
  for (let x = 8; x < 390; x += 13) {
    const L = 50 + rnd() * 120, sway = (rnd() - .5) * 10;
    s += `<path d="M${x} 0 Q${x + sway} ${f(L/2)} ${f(x + sway/2)} ${f(L)}" fill="none" stroke="#8a9673" stroke-width=".8"/>`;
    for (let y = 8; y < L; y += 9) s += leaf(x + sway * (y / L) * .7, y, 6 + rnd() * 2, (y / 9 % 2 ? 60 : 120) + (rnd() - .5) * 20, "#8a9870");
    if (rnd() > .55) s += wisteria(x + sway / 2, L, 16, 7);
  }
  return `<svg class="bleed" viewBox="0 0 390 185" aria-hidden="true"><g filter="url(#emb)">${s}</g></svg>`;
}

function roseVine() {
  seed = 66;
  let s = `<path d="M22 0 C6 40 36 80 22 120 C8 160 36 200 22 240 C10 270 26 290 22 312" fill="none" stroke="#6f7d58" stroke-width="1.6"/>`;
  let d = "";
  for (let y = 10; y < 300; y += 15) d += leaf(22 + Math.sin(y / 20) * 10, y, 10 + rnd() * 3, y / 15 % 2 ? 210 : -30);
  for (let y = 18; y < 300; y += 36) d += rose(22 + Math.sin(y / 20) * 10, y, 7 + rnd() * 2.5, pick(["wine", "dusty", "blush", "cream"]));
  d += `<path d="M22 312 C12 300 6 314 14 318 C18 320 22 316 22 312 C32 300 38 314 30 318 C26 320 22 316 22 312 L14 340 M22 312 L30 342" fill="#e9c6c6" stroke="#cf9fa2" stroke-width="1.2"/>`;
  return `<svg viewBox="0 0 44 346" preserveAspectRatio="xMidYMin meet" aria-hidden="true">${s}<g filter="url(#emb)">${d}</g></svg>`;
}

function ringBadge(n = 0) {
  seed = 200 + n * 17;
  const cols = INVITE.palette.map(([, c]) => c);
  const bloom = (x, y, r, c) => `<g transform="translate(${f(x)} ${f(y)}) rotate(${f(rnd() * 72)})">${[0, 72, 144, 216, 288].map(a => { const px = Math.cos(a * Math.PI / 180) * r * .62, py = Math.sin(a * Math.PI / 180) * r * .62; return `<ellipse cx="${f(px)}" cy="${f(py)}" rx="${f(r * .52)}" ry="${f(r * .4)}" transform="rotate(${a} ${f(px)} ${f(py)})" fill="${c}"/>`; }).join("")}<circle r="${f(r * .26)}" fill="#e8c46a"/></g>`;
  let s = sat(`<circle cx="40" cy="40" r="29"/>`, "#f6ecea");
  s += `<circle cx="40" cy="40" r="34" fill="none" stroke="#7b6a58" stroke-width="1.2"/>`;
  let lv = "", fl = "";
  for (let k = 0; k < 30; k++) {
    const a = k / 30 * Math.PI * 2, x = 40 + Math.cos(a) * 34, y = 40 + Math.sin(a) * 34, deg = a * 180 / Math.PI;
    lv += leaf(x, y, 9 + rnd() * 3, deg + 90 + (k % 2 ? 35 : -35), k % 3 ? "#7d8c63" : "#8a9870");
  }
  const start = rnd() * Math.PI * 2;
  for (let k = 0; k < 8; k++) {
    const a = start + k / 8 * Math.PI * 2 + (rnd() - .5) * .3, x = 40 + Math.cos(a) * 34, y = 40 + Math.sin(a) * 34;
    fl += k % 2 ? rose(x, y, 5.2 + rnd() * 1.2, pick(["blush", "cream", "dusty", "wine"])) : bloom(x, y, 5, cols[(k + n * 2) % cols.length]);
  }
  return `<svg viewBox="-6 -6 92 92" aria-hidden="true"><g filter="url(#emb)">${s}${lv}${fl}</g><circle cx="40" cy="40" r="25" fill="none" stroke="#d1b3ae" stroke-width=".8" stroke-dasharray="1.5 2.5"/></svg>`;
}

function giftFrame() {
  seed = 88;
  let s = `<path d="M34 24 H266 L286 44 V360 L266 380 H34 L14 360 V44 Z" fill="rgba(255,255,255,.25)" stroke="#c39a73" stroke-width="2"/>
           <path d="M38 31 H262 L279 48 V356 L262 373 H38 L21 356 V48 Z" fill="none" stroke="#c39a73" stroke-width=".8" opacity=".7"/>`;
  let v = "";
  [[14, 1], [286, -1]].forEach(([x0, dir]) => {
    v += `<path d="M${x0} 370 C${x0 + dir*10} 300 ${x0 - dir*8} 230 ${x0} 160 C${x0 + dir*8} 120 ${x0} 90 ${x0 + dir*6} 60" fill="none" stroke="#6f7d58" stroke-width="1.3"/>`;
    for (let y = 70; y < 365; y += 14) v += leaf(x0 + Math.sin(y / 30) * 6 * dir, y, 9 + rnd() * 3, (y / 14 % 2 ? -20 : 200) + (rnd() - .5) * 30);
    [110, 190, 270, 340].forEach((y, i) => { v += rose(x0 + Math.sin(y / 30) * 6 * dir, y, 6 + i % 2 * 1.5, i % 2 ? "wine" : "dusty"); });
  });
  const bow = `M150 22 C126 4 112 24 130 30 C140 33 146 28 150 22 C174 4 188 24 170 30 C160 33 154 28 150 22 Z M150 22 L136 54 L142 52 L150 26 L158 52 L164 54 Z`;
  v += sat(`<path d="${bow}"/>`, "#ecd0cf") + `<circle cx="150" cy="22" r="4" fill="#d9aeb0"/>`;
  return `<svg viewBox="0 0 300 390" aria-hidden="true">${s}<g filter="url(#emb)">${v}</g></svg>`;
}

const ICONS = {

  rings:  `<circle cx="19" cy="29" r="9"/><circle cx="29" cy="29" r="9"/><path d="M26 18l3-5 3 5-3 3Z" fill="#fff"/><path d="M8 40c4 2 8 2 12 0M6 22c3-6 8-8 12-6" stroke="#c48c94"/>`,
  coupe:  `<path d="M11 15h26c0 7-5 11-13 11s-13-4-13-11Z" fill="#f2dfb5"/><path d="M24 26v13M16 41h16"/><circle cx="20" cy="19" r=".8" fill="#6b575a"/><circle cx="26" cy="18" r=".8" fill="#6b575a"/><path d="M30 8l2-3M34 10l3-2"/>`,
  disco:  `<path d="M24 4v10"/><circle cx="24" cy="27" r="12" fill="#e7dfdc"/><path d="M12 27h24M14 21h20M14 33h20M24 15v24M18 16c-3 7-3 15 0 22M30 16c3 7 3 15 0 22"/><path d="M38 12l1 3 3 1-3 1-1 3-1-3-3-1 3-1Z" fill="#f2dfb5"/>`,
  cheers: `<g transform="rotate(-14 18 24)"><path d="M14 8h8l-1 13a3 3 0 0 1-6 0Z" fill="#f2dfb5"/><path d="M18 24v12M14 37h8"/></g><g transform="rotate(14 30 24)"><path d="M26 8h8l-1 13a3 3 0 0 1-6 0Z" fill="#f2dfb5"/><path d="M30 24v12M26 37h8"/></g><path d="M24 3v4M20 5l2 2M28 5l-2 2"/>`
};
const icon = k => `<svg viewBox="0 0 48 48" fill="none" stroke="#6b575a" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[k] || ""}</svg>`;

    <g fill="none" stroke="url(#foil)" stroke-width="1.6" stroke-linecap="round">

}

/* ---------- links ---------- */
const start = new Date(INVITE.dateISO);
const gcal = d => d.toISOString().replace(/[-:]/g, "").replace(/\.\d{3}/, "");
const mapsUrl = qy => "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(qy);
const calUrl = "https://calendar.google.com/calendar/render?action=TEMPLATE"
  + "&text=" + encodeURIComponent(`${INVITE.first1} & ${INVITE.first2}'s Wedding`)
  + "&dates=" + gcal(start) + "/" + gcal(new Date(start.getTime() + 5 * 3600e3))
  + "&location=" + encodeURIComponent(`${INVITE.venue}, ${INVITE.address.join(", ")}`);
const pin = `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s7-7 7-12a7 7 0 0 0-14 0c0 5 7 12 7 12Z"/><circle cx="12" cy="10" r="2.5"/></svg>`;
const cal = `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>`;

/* ---------- render ---------- */
const I = INVITE;
document.getElementById("seal").innerHTML = sealSVG();
document.getElementById("card").innerHTML = `
  <section class="hero" aria-label="${esc(`${I.first1} and ${I.first2}, ${I.dateShort}`)}">
    <div class="drape">
      <div class="names-hero"><b>${esc(I.first1)}</b><i>&amp;</i><b>${esc(I.first2)}</b><small>${esc(I.dateShort)}</small></div>
      <div class="curtain l">${curtainFlowers("l")}</div><div class="curtain r">${curtainFlowers("r")}</div>
      ${tieback("l")}
      ${tieback("r")}
    </div>
    ${valance()}
    ${estate()}
  </section>

  <section class="sec">
    <div class="bleed">${garland(190, { minL: 40, maxL: 150 })}</div>
    <h2>${esc(I.welcomeTitle)}</h2>
    <p class="prose">${esc(I.welcome)}</p>
    ${flowerArch()}
  </section>

  <section class="sec">
    ${pearlBand()}
    <div class="bleed">${garland(120, { y0: 10, sag: 18, minL: 20, maxL: 80 })}</div>
    <h2>Countdown</h2>
    <div class="countdown" id="countdown">
      ${["Days", "Hours", "Minutes", "Seconds"].map((l, n) => `<div class="badge"><div class="ring">${ringBadge(n)}<b data-k="${l[0]}">0</b></div><span>${l}</span></div>`).join("")}
    </div>
  </section>

  <section class="sec">
    ${necklace()}
    <p class="caps">Save the Date with</p>
    <p class="emboss">${esc(`${I.first1} ${I.last1}`.trim())}<span class="and">and</span>${esc(`${I.first2} ${I.last2}`.trim())}</p>
    <p class="prose" style="font-style:normal">${esc(I.dateLong)}</p>
  </section>

  <section class="sec">
    <div class="venue">
      <div class="arbor">${arbor()}</div>
      <h3>Ceremony<br>&amp; Reception</h3>
      <p class="caps">Where we celebrate</p>
      <p class="place">${esc(I.venue)}</p>
      <p class="addr">${I.address.map(esc).join("<br>")}</p>
      <p class="when">${esc(I.dateLong)}<br>Ceremony · ${esc(I.ceremony)}<br>Reception · ${esc(I.reception)}<br><span style="color:var(--ink-soft)">Both at the same venue</span></p>
      <div class="links">
        <a class="link" href="${esc(mapsUrl(I.mapQuery))}" target="_blank" rel="noopener">${pin}Open in maps</a>
        <a class="link" href="${esc(calUrl)}" target="_blank" rel="noopener">${cal}Add to calendar</a>

    <p class="prose" style="max-width:32ch">${esc(I.dressNote)}</p>
    <p class="palette-line">${I.palette.map(([n]) => `<span style="white-space:nowrap">${esc(n)}</span>`).join(" &middot; ")}</p>
    <div class="swatches">${I.palette.map(([n, c]) => `<svg viewBox="0 0 44 44" role="img" aria-label="${esc(n)}"><title>${esc(n)}</title><g filter="url(#emb)">${sat(`<circle cx="22" cy="22" r="18"/>`, esc(c))}</g></svg>`).join("")}</div>

      ${I.timeline.map(([k, t, what, more]) => `<li>${icon(k)}<div><time>${esc(t)}</time><small>${esc(what)}</small>${more ? `<em>${esc(more)}</em>` : ""}</div></li>`).join("")}

/* scattered background flowers in the dress-code colours */
function scatterFlowers() {
  const card = document.getElementById("card"), hero = card.querySelector(".hero");
  card.querySelector(".bgflowers")?.remove();
  const top = hero.offsetHeight, W = card.clientWidth, H = card.scrollHeight - top;
  if (H <= 0) return;
  seed = 101;
  const cols = I.palette.map(([, c]) => c);
  const bloom = (x, y, r, c) => `<g transform="translate(${f(x)} ${f(y)}) rotate(${f(rnd() * 72)})">${[0, 72, 144, 216, 288].map(a => `<ellipse cx="${f(Math.cos(a * Math.PI / 180) * r * .62)}" cy="${f(Math.sin(a * Math.PI / 180) * r * .62)}" rx="${f(r * .52)}" ry="${f(r * .4)}" transform="rotate(${a} ${f(Math.cos(a * Math.PI / 180) * r * .62)} ${f(Math.sin(a * Math.PI / 180) * r * .62)})" fill="${c}"/>`).join("")}<circle r="${f(r * .26)}" fill="#e8c46a"/></g>`;
  let s = "";
  const n = Math.round(H / 22);
  for (let i = 0; i < n; i++) {
    const edge = rnd() < .72;
    const x = edge ? (rnd() < .5 ? rnd() * 52 : W - rnd() * 52) : 60 + rnd() * (W - 120);
    const y = rnd() * H, r = 4 + rnd() * 5, op = edge ? .85 : .42;
    const sprig = rnd() < .5 ? leaf(x, y, r * 2, rnd() * 360) : "";
    const flower = rnd() < .22 ? rose(x, y, r, pick(["blush", "cream", "dusty"])) : bloom(x, y, r, pick(cols));
    s += `<g class="fl${rnd() < .35 ? " drift" : ""}" style="--d:${f(4 + rnd() * 5)}s;--dl:${f(-rnd() * 8)}s" opacity="${op}"><g filter="url(#emb)">${sprig}${flower}</g></g>`;
  }
  const layer = document.createElement("div");
  layer.className = "bgflowers";
  layer.style.top = top + "px"; layer.style.height = H + "px";
  layer.setAttribute("aria-hidden", "true");
  layer.innerHTML = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${s}</svg>`;
  card.prepend(layer);
}
scatterFlowers();
document.fonts?.ready.then(scatterFlowers);
let rz; addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(scatterFlowers, 200); });

/* countdown */
const cells = Object.fromEntries([...document.querySelectorAll("#countdown b")].map(b => [b.dataset.k, b]));
function tick() {
  let s = Math.max(0, Math.floor((start.getTime() - Date.now()) / 1000));
  cells.D.textContent = Math.floor(s / 86400); s %= 86400;
  cells.H.textContent = String(Math.floor(s / 3600)).padStart(2, "0"); s %= 3600;
  cells.M.textContent = String(Math.floor(s / 60)).padStart(2, "0");
  cells.S.textContent = String(s % 60).padStart(2, "0");
}
tick(); setInterval(tick, 1000);

/* timeline bead follows scroll */
const card = document.getElementById("card"), tl = document.getElementById("timeline"), bead = document.getElementById("bead");
function moveBead() {
  const c = card.getBoundingClientRect(), r = tl.getBoundingClientRect();
  const p = Math.min(1, Math.max(0, (c.top + c.height * .55 - r.top) / r.height));
  bead.style.top = f(p * (r.height - 56)) + "px";
}
card.addEventListener("scroll", moveBead, { passive: true }); moveBead();

/* open / close */
const stage = document.getElementById("stage");
let t;
function open() {
  clearTimeout(t);
  stage.classList.remove("gone"); stage.classList.add("opened");
  t = setTimeout(() => stage.classList.add("gone"), 1800);
  card.tabIndex = -1; card.focus({ preventScroll: true });
}
function close() {
  clearTimeout(t);
  card.scrollTo({ top: 0 });
  stage.classList.remove("gone");
  requestAnimationFrame(() => stage.classList.remove("opened"));
  setTimeout(() => document.getElementById("seal").focus(), 1700);
}
document.getElementById("seal").addEventListener("click", open);
document.getElementById("replay").addEventListener("click", close);
document.getElementById("copy").addEventListener("click", async e => {
  const b = e.currentTarget;
  try { await navigator.clipboard.writeText(I.rsvpContact); b.textContent = "Copied"; }
  catch { const r = document.createRange(); r.selectNodeContents(document.getElementById("phone")); getSelection().removeAllRanges(); getSelection().addRange(r); b.textContent = "Selected"; }
  setTimeout(() => (b.textContent = "Copy number"), 1800);
});
</script>
